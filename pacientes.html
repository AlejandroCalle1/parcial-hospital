<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - Hospital</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Header / Navegación del proyecto -->
    <header>
        <a href="index.html" class="titulo-link">HOSPITAL</a>
        <nav>
            <ul>
                <li><a href="medicos.html">Médicos</a></li>
                <li><a href="pacientes.html">Pacientes</a></li>
                <li><a href="consultas.html">Consultas</a></li>
            </ul>
        </nav>
        <a href="login.html" class="btn-ingresar">Ingresar</a>
    </header>

    <main style="max-width: 1100px; margin: 40px auto; padding: 0 20px;">
        
        <!-- Formulario estilizado (POST / PUT) -->
        <section class="tarjeta" style="margin-bottom: 30px;">
            <div class="tarjeta-cabecera">
                <h2 id="form-titulo" style="color: #1a3a6b; font-size: 1.4rem;">Registrar Nuevo Paciente</h2>
            </div>
            
            <form id="form-paciente" class="formulario-reserva" style="max-width: 100%;">
                <input type="hidden" id="id_paciente">
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <input type="text" id="nombre" placeholder="Nombre" required>
                    <input type="text" id="apellido" placeholder="Apellido" required>
                    <input type="text" id="documento" placeholder="Documento" required>
                    <input type="number" id="edad" placeholder="Edad" required>
                    <input type="text" id="telefono" placeholder="Teléfono" required>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" id="btn-guardar" class="btn-explorar" style="border:none; cursor:pointer;">Guardar Paciente</button>
                    <button type="button" id="btn-cancelar" class="btn-explorar" style="background-color: #64748b; display: none; border:none; cursor:pointer;" onclick="limpiarFormulario()">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Tabla estilizada (GET) -->
        <section class="tarjeta">
            <h2 style="color: #1a3a6b; font-size: 1.4rem; margin-bottom: 15px;">Lista de Pacientes</h2>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="background-color: #1a3a6b; color: white;">
                            <th style="padding: 12px;">ID</th>
                            <th style="padding: 12px;">Nombre</th>
                            <th style="padding: 12px;">Apellido</th>
                            <th style="padding: 12px;">Documento</th>
                            <th style="padding: 12px;">Edad</th>
                            <th style="padding: 12px;">Teléfono</th>
                            <th style="padding: 12px; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-pacientes">
                        <!-- Se llena dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Sistema Hospitalario - Proyecto DAW</p>
    </footer>

    <script src="js/pacientes.js"></script>
</body>
</html>
