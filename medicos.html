<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos - Sistema Hospitalario</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/medicos.js" defer></script>
</head>
<body>

    <header>
        <h1><a href="index.html" class="titulo-link">Sistema Hospitalario</a></h1>
        <nav>
            <ul>
                <li><a href="medicos.html">Médicos</a></li>
                <li><a href="pacientes.html">Pacientes</a></li>
                <li><a href="consultas.html">Consultas médicas</a></li>
            </ul>
        </nav>
        <form action="login.html" style="margin: 0;">
            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>
    </header>

    <main>
        <section class="preguntas-frecuentes">
            <h1>Gestión de médicos</h1>

            <!-- Párrafo vacío. "mensaje" es el aviso: el JS escribe aquí "Médico creado", errores, etc. -->
            <p id="mensaje"></p>

            <!-- Formulario para crear y editar -->
            <form id="form-medico">
                <h2 id="titulo-form">Nuevo médico</h2>

                <label for="medico-id">ID</label> <!-- caja de solo lectura, se asigna automáticamente -->
                <input type="text" id="medico-id" placeholder="Se asigna solo" readonly> <!-- caja vacia -->

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" maxlength="100" required>

                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad" maxlength="100" required>

                <!-- Envía el formulario -->
                <button type="submit" id="btn-guardar" class="btn-explorar">Guardar</button>
                <!-- Cancela la edición (oculto hasta que se edita) -->
                <button type="button" id="btn-cancelar" class="btn-explorar" hidden>Cancelar</button>
            </form>

            <!-- Tabla con la lista -->
            <h2>Listado de médicos</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!-- El JS llena las filas aquí -->
                <tbody id="tabla-medicos"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema Hospitalario. Todos los derechos reservados.</p>
        <nav class="footer-nav">
            <a href="index.html">Inicio</a>
            <a href="medicos.html">Médicos</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="consultas.html">Consultas</a>
        </nav>
    </footer>

</body>
</html>
