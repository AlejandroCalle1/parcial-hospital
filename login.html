<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Chronos Travel</title>
    <link rel="stylesheet" href="css/estilos.css">
    
</head>
<body>

    <header>
        <h1><a href="index.html" class="titulo-link">Chronos travel</a></h1>
        <nav>
            <ul>
                <li><a href="destinos_historicos.html">Destinos históricos</a></li>
                <li><a href="destinos_futuristas.html">Destinos futuristas</a></li>
                <li><a href="hoteles_paquetes_viajes.html">Hoteles y paquetes de viaje</a></li>
                <li><a href="reglas_viajes.html">Reglas para viajes en el tiempo</a></li>
            </ul>
        </nav>
        <button class="btn-ingresar" onclick="location.href='login.html'">Ingresar</button>
    </header>

    <main class="login-container">
        <form class="login-card">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa a tu cuenta para gestionar tus viajes temporales.</p>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="usuario@chronostravel.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Ingresar a la plataforma</button>
            
            <a href="index.html" class="back-link">← Volver al inicio</a>
        </form>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
